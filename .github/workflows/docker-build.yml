---
name: Docker Build Checks

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Validate and test the application on the GitHub runner
      # ------------------------------------------------------------

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: docker compose config

      - name: Build vote image
        run: docker build -t voting-app-vote:ci ./vote

      - name: Build worker image
        run: docker build -t voting-app-worker:ci ./worker

      - name: Build result image
        run: docker build -t voting-app-result:ci ./result

      - name: Start Docker Compose stack
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: docker compose up -d --build

      - name: Wait for services to start
        run: sleep 10

      - name: Test vote service
        run: curl --fail http://localhost:5000

      - name: Test result service
        run: curl --fail http://localhost:3000

      - name: Show Docker Compose status
        if: always()
        run: docker compose ps

      - name: Stop Docker Compose stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: docker compose down -v

      # ------------------------------------------------------------
      # Prepare Docker for multi-architecture builds
      # ------------------------------------------------------------

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Build and publish AMD64 + ARM64 images to GHCR
      # ------------------------------------------------------------

      - name: Build and push vote image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shellback1998/voting-app-vote:latest
            ghcr.io/shellback1998/voting-app-vote:${{ github.sha }}

      - name: Build and push worker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shellback1998/voting-app-worker:latest
            ghcr.io/shellback1998/voting-app-worker:${{ github.sha }}

      - name: Build and push result image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./result
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shellback1998/voting-app-result:latest
            ghcr.io/shellback1998/voting-app-result:${{ github.sha }}
