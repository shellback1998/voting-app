---
name: Docker Build Checks

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: docker compose config

      - name: Build vote image
        run: docker build -t voting-app-vote:ci ./vote

      - name: Build worker image
        run: docker build -t voting-app-worker:ci ./worker

      - name: Build result image
        run: docker build -t voting-app-result:ci ./result

      - name: Start Docker Compose stack
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: docker compose up -d --build

      - name: Wait for services to start
        run: sleep 10

      - name: Test vote service
        run: curl --fail http://localhost:5000

      - name: Test result service
        run: curl --fail http://localhost:3000

      - name: Show Docker Compose status
        if: always()
        run: docker compose ps

      - name: Stop Docker Compose stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: docker compose down -v

      - name: Tag Docker images for GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag voting-app-vote:latest ghcr.io/shellback1998/voting-app-vote:latest
          docker tag voting-app-vote:latest ghcr.io/shellback1998/voting-app-vote:${{ github.sha }}

          docker tag voting-app-worker:latest ghcr.io/shellback1998/voting-app-worker:latest
          docker tag voting-app-worker:latest ghcr.io/shellback1998/voting-app-worker:${{ github.sha }}

          docker tag voting-app-result:latest ghcr.io/shellback1998/voting-app-result:latest
          docker tag voting-app-result:latest ghcr.io/shellback1998/voting-app-result:${{ github.sha }}

      - name: Push Docker images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/shellback1998/voting-app-vote:latest
          docker push ghcr.io/shellback1998/voting-app-vote:${{ github.sha }}

          docker push ghcr.io/shellback1998/voting-app-worker:latest
          docker push ghcr.io/shellback1998/voting-app-worker:${{ github.sha }}

          docker push ghcr.io/shellback1998/voting-app-result:latest
          docker push ghcr.io/shellback1998/voting-app-result:${{ github.sha }}
